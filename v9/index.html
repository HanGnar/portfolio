<title>헝그리한정민</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
/* 헝그리한정민 v0.3 — Material 3 규칙(색 역할 · 타입 · 모양)만 쓰고 부품은 최소로.
 * 레이아웃: 왼쪽 시작선 하나. 상자는 검색창 · 이미지에만, 나머지는 글자와 선으로 나눈다.
 * 색 예산: primary(파랑)는 '질문 보내기' · '다음 프로젝트' 두 곳, highlight(형광펜)는 근거와 '질문' 한 단어.
 * 글자: 제목(700) · 본문(400) · 보조(작게, 연한 색) 세 단계. */
:root {
  --md-primary: #0B57D0; --md-on-primary: #FFFFFF;
  --md-surface: #FFFFFF; --md-on-surface: #1F1F1F; --md-on-surface-variant: #5E6268;
  --md-surface-container: #F3F4F6; --md-surface-container-high: #ECEDEF;
  --md-outline-variant: #E2E3E5;
  --md-highlight: #FDE293; --md-on-highlight: #1F1F1F;
  --img: #E9E9EB;
  --hero-bg: #F8F9FA; --glow: #CFE0FA; --mk: #FDE293;
  --md-shadow: rgba(0, 0, 0, .12);
  --md-font: "Google Sans", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --md-m: 12px; --md-l: 16px; --md-xl: 28px; --md-full: 999px;
  --md-ease: cubic-bezier(.2, 0, 0, 1); --ease-out: cubic-bezier(.05, .7, .1, 1); --ease-in: cubic-bezier(.3, 0, .8, .15);
  --sp-sec: 112px; --sp-head: 40px;
  --wrap: 1080px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --md-primary: #A8C7FA; --md-on-primary: #062E6F;
    --md-surface: #131314; --md-on-surface: #E8E8E8; --md-on-surface-variant: #A3A7AD;
    --md-surface-container: #1C1D1F; --md-surface-container-high: #26282A; --md-outline-variant: #2E3033;
    --md-highlight: #FDD663; --md-on-highlight: #1F1F1F; --img: #26282A; --hero-bg: #131314; --glow: rgba(66, 133, 244, .22); --mk: rgba(253, 214, 99, .32); --md-shadow: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --md-primary: #A8C7FA; --md-on-primary: #062E6F;
  --md-surface: #131314; --md-on-surface: #E8E8E8; --md-on-surface-variant: #A3A7AD;
  --md-surface-container: #1C1D1F; --md-surface-container-high: #26282A; --md-outline-variant: #2E3033;
  --md-highlight: #FDD663; --md-on-highlight: #1F1F1F; --img: #26282A; --hero-bg: #131314; --glow: rgba(66, 133, 244, .22); --mk: rgba(253, 214, 99, .32); --md-shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--md-surface); color: var(--md-on-surface); font-family: var(--md-font); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--md-surface); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; letter-spacing: -0.02em; }
p { margin: 0; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; white-space: nowrap; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga"; width: 1em; overflow: hidden; flex: none; }
.mk { background: linear-gradient(transparent 56%, var(--mk) 56%, var(--mk) 92%, transparent 92%); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.meta { color: var(--md-on-surface-variant); font-size: 15px; }
.link { color: var(--md-on-surface); text-decoration: underline; text-decoration-color: var(--md-outline-variant); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.link:hover { text-decoration-color: currentColor; }
.imgbox { background: var(--img); border-radius: var(--md-m); display: grid; place-items: center; color: var(--md-on-surface-variant); font-size: 13px; max-width: 100%; }

/* 헤더 */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: transparent; border-bottom: 1px solid transparent; transition: background .2s, border-color .2s; }
.hdr.on { background: var(--md-surface); border-bottom-color: var(--md-outline-variant); }
.hdr .wrap { display: flex; align-items: center; height: 64px; gap: 28px; }
.logo { font-size: 18px; color: var(--md-on-surface); text-decoration: none; margin-right: auto; }
.logo b { font-weight: 700; }
.nav { display: flex; gap: 28px; }
.nav a { color: var(--md-on-surface-variant); text-decoration: none; font-size: 15px; }
.nav a:hover { color: var(--md-on-surface); }

/* 히어로: Gemini 첫 화면처럼 가운데 한 줄 + 흰 질문창, 뒤에 은은한 파란 빛
 * 노트북마다 화면 높이가 달라서(약 630~900) 글자 · 간격은 화면 폭과 높이 중 작은 쪽에 맞춘다. 내용은 가운데보다 살짝 위. */
.hero { --bar: clamp(52px, 7vh, 60px); margin-top: -64px; padding: 64px 0 clamp(40px, 10vh, 120px); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
  background: radial-gradient(min(52vw, 760px) min(46vh, 420px) at 54% 58%, var(--glow) 0%, transparent 100%), var(--hero-bg); }
.hero .wrap { width: 100%; display: flex; flex-direction: column; align-items: center; }
.hero h1 { word-break: keep-all; font-weight: 300; font-size: clamp(26px, min(3.2vw, 5.2vh), 42px); line-height: 1.3; letter-spacing: -0.02em; text-align: center; }
.hero.chat { height: 100vh; height: 100svh; min-height: 520px; justify-content: stretch; padding-bottom: clamp(16px, 3vh, 28px); }
.hero.chat .wrap { flex: 1; min-height: 0; }
.hero.chat h1 { display: none; }
.thread { display: none; }
.hero.chat .thread { display: flex; flex-direction: column; gap: 28px; flex: 1; min-height: 0; width: 100%; max-width: 680px; overflow-y: auto; padding: 24px 20px 32px; scrollbar-width: thin; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 36px); mask-image: linear-gradient(transparent, #000 36px); }
.hero.chat .thread::before { content: ""; margin-top: auto; }
.hero.chat .ask { margin-top: 0; }
.msg-q { align-self: flex-end; max-width: 80%; padding: 10px 18px; border-radius: 22px 22px 6px 22px; background: var(--md-surface-container-high); font-size: 16px; line-height: 1.55; word-break: keep-all; }
.thread-end { align-self: center; font-size: 14px; color: var(--md-on-surface-variant); }
.ask { position: relative; width: 100%; max-width: 640px; margin-top: clamp(24px, 4.5vh, 40px); }
.askbox { display: flex; align-items: center; gap: 10px; height: var(--bar); padding: 0 8px 0 24px; border-radius: var(--md-full); background: var(--md-surface);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .05), 0 8px 24px rgba(31, 75, 150, .10); }
.ask.open .askbox { border-radius: calc(var(--bar) / 2) calc(var(--bar) / 2) 0 0; }
.askbox input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; font-size: 16px; }
.askbox input::placeholder { color: var(--md-on-surface-variant); }
.send { width: calc(var(--bar) - 16px); height: calc(var(--bar) - 16px); border-radius: var(--md-full); background: var(--md-primary); color: var(--md-on-primary); display: grid; place-items: center; transition: opacity .15s; }
.send .ms { font-size: 20px; }
.askbox:not(.has) .send { opacity: 0; pointer-events: none; }
.hero.chat .ask.open .askbox { border-radius: 0 0 calc(var(--bar) / 2) calc(var(--bar) / 2); }
.hero.chat .sug { top: auto; bottom: var(--bar); border-radius: calc(var(--bar) / 2) calc(var(--bar) / 2) 0 0; box-shadow: 0 -10px 24px rgba(31, 75, 150, .10); display: flex; flex-direction: column-reverse; }
.hero.chat .sug::before { display: none; }
.sug { position: absolute; left: 0; right: 0; top: var(--bar); z-index: 5; margin: 0; padding: 0 0 10px; list-style: none; background: var(--md-surface); border-radius: 0 0 calc(var(--bar) / 2) calc(var(--bar) / 2);
  box-shadow: 0 14px 26px rgba(31, 75, 150, .12); max-height: min(340px, 52vh); overflow-y: auto; }
.sug::before { content: ""; display: block; height: 1px; margin: 0 20px 4px; background: var(--md-outline-variant); }
.sug li { padding: 9px 24px; cursor: pointer; font-size: 15px; }
.sug li.on, .sug li:hover { background: color-mix(in srgb, var(--md-on-surface) 5%, transparent); }

/* 답변: 상자 없이 글로 */
.ans { width: 100%; }
.ans .body { display: grid; gap: 10px; font-size: 17px; line-height: 1.75; }
.cite { margin-left: 8px; font-size: 14px; color: var(--md-on-surface-variant); text-decoration: underline; text-decoration-color: var(--md-highlight); text-decoration-thickness: 3px; text-underline-offset: 3px; vertical-align: 1px; white-space: nowrap; }
.cite:hover { background: var(--md-highlight); color: var(--md-on-highlight); }
.ans .next { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 16px; }
.ans .ask-back { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--md-outline-variant); }
.ans .ask-back p { font-weight: 700; }
.ans .opts { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 16px; }
.ans .opts .skip { color: var(--md-on-surface-variant); }
.caret::after { content: "▍"; margin-left: 2px; animation: blink 1s steps(1) infinite; color: var(--md-on-surface-variant); }
@keyframes blink { 50% { opacity: 0; } }

/* 섹션 */
.sec { padding-block: var(--sp-sec); border-top: 1px solid var(--md-outline-variant); }
.sec h2 { font-size: 32px; line-height: 1.3; }

/* 프로젝트: 상자 없는 목록(이미지 · 글) */
.filter { display: flex; gap: 28px; margin-top: 20px; }
.filter button { padding: 6px 0; font-size: 16px; color: var(--md-on-surface-variant); border-bottom: 2px solid transparent; }
.filter button[aria-selected="true"] { color: var(--md-on-surface); font-weight: 700; border-bottom-color: var(--md-on-surface); }
.fit { margin-top: 16px; }
.works { margin-top: var(--sp-head); }
.row { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 40px; align-items: center; width: 100%; text-align: left; padding-block: 28px; border-top: 1px solid var(--md-outline-variant); }
.row:last-child { border-bottom: 1px solid var(--md-outline-variant); }
.row .imgbox { aspect-ratio: 16 / 10; }
.row .kind { color: var(--md-on-surface-variant); font-size: 15px; }
.row h3 { margin-top: 6px; font-size: 26px; line-height: 1.3; }
.row p { margin-top: 8px; color: var(--md-on-surface-variant); }
.row:hover h3 { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }

/* 소개 */
.about { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 56px; margin-top: var(--sp-head); }
.about .imgbox { aspect-ratio: 3 / 4; }
.about .name { margin-top: 14px; font-weight: 700; }
.intro { font-size: 22px; line-height: 1.6; font-weight: 500; letter-spacing: -0.01em; max-width: 30em; }
.caps { margin-top: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
.cap { border-top: 1px solid var(--md-on-surface); padding-top: 16px; }
.cap h3 { font-size: 18px; letter-spacing: -0.01em; }
.cap p { margin-top: 6px; font-size: 15px; color: var(--md-on-surface-variant); }
.lists { margin-top: 72px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
.lists h3 { font-size: 15px; letter-spacing: 0; }
.lists ul { list-style: none; padding: 0; margin: 10px 0 0; }
.lists li { display: flex; gap: 16px; padding-block: 8px; font-size: 15px; }
.lists li .meta { flex: none; font-size: 14px; font-variant-numeric: tabular-nums; }
.lists .line { margin-top: 10px; font-size: 15px; line-height: 1.9; }

/* 연락처 */
.contact { padding-block: var(--sp-sec); border-top: 1px solid var(--md-outline-variant); }
.closing { font-size: clamp(32px, 4.4vw, 44px); line-height: 1.3; font-weight: 700; letter-spacing: -0.035em; }
.mail { margin-top: 28px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.mail button { font-size: 20px; }

/* 상세 */
.detail { position: fixed; inset: 0; z-index: 40; background: var(--md-surface); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dbar { position: sticky; top: 0; z-index: 2; background: var(--md-surface); border-bottom: 1px solid transparent; transition: border-color .2s; }
.dbar.on { border-bottom-color: var(--md-outline-variant); }
.dbar .wrap { height: 64px; display: flex; align-items: center; gap: 20px; }
.dbar .back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--md-on-surface-variant); }
.dbar .back:hover { color: var(--md-on-surface); }
.dbar .t { font-weight: 700; opacity: 0; transition: opacity .2s; }
.dbar.on .t { opacity: 1; }
.dtop { padding-block: 48px 40px; }
.dtop h1 { margin-top: 8px; font-size: clamp(36px, 5vw, 52px); line-height: 1.2; letter-spacing: -0.035em; }
.dtop .line { margin-top: 12px; font-size: 20px; color: var(--md-on-surface-variant); max-width: 32em; }
.dinfo { margin: 28px 0 0; display: flex; flex-wrap: wrap; gap: 8px 40px; font-size: 15px; }
.dinfo div { display: flex; gap: 10px; }
.dinfo dt { color: var(--md-on-surface-variant); }
.dinfo dd { margin: 0; }
.dcover { aspect-ratio: 16 / 9; }
.dsec { padding-block: 72px; border-bottom: 1px solid var(--md-outline-variant); }
.dsec h2 { font-size: 28px; }
.dsec .p { margin-top: 14px; font-size: 19px; line-height: 1.7; max-width: 36em; }
.dsec .items { margin-top: 36px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.dsec .item .imgbox { aspect-ratio: 4 / 3; }
.dsec .item h3 { margin-top: 14px; font-size: 18px; letter-spacing: -0.01em; }
.dsec .item p { margin-top: 4px; font-size: 15px; color: var(--md-on-surface-variant); }
.dnext { padding-block: 64px 112px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.dnext .go { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: var(--md-full); background: var(--md-primary); color: var(--md-on-primary); font-weight: 500; }


/* ── 움직임: M3 강조 감속(ease-out)으로 들어오고, 짧게 나간다 ───────────── */
.hero { position: relative; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(min(40vw, 600px) min(36vh, 340px) at 56% 62%, var(--glow) 0%, transparent 100%); opacity: .55; animation: breathe 9s ease-in-out infinite alternate; }
@keyframes breathe { from { transform: scale(1) translateX(0); opacity: .35; } to { transform: scale(1.08) translateX(-1.5%); opacity: .7; } }
.askbox { transition: box-shadow .3s var(--md-ease), border-radius .2s var(--md-ease), transform .3s var(--md-ease); }
.askbox:focus-within { box-shadow: 0 1px 3px rgba(0, 0, 0, .05), 0 12px 32px rgba(31, 75, 150, .16); }
.send { transition: opacity .18s var(--md-ease), transform .3s var(--ease-out), background-color .2s; }
.askbox:not(.has) .send { transform: scale(.6); }
.send:active { transform: scale(.92); }
.sug:not([hidden]) { animation: sugDown .22s var(--ease-out); }
.hero.chat .sug:not([hidden]) { animation-name: sugUp; }
@keyframes sugDown { from { opacity: 0; transform: translateY(-6px); } }
@keyframes sugUp { from { opacity: 0; transform: translateY(6px); } }
.sug li { transition: background-color .15s; }
.thread { animation: fadeIn .4s ease both; }
.msg-q { animation: qIn .36s var(--ease-out) both; transform-origin: 100% 100%; }
@keyframes qIn { from { opacity: 0; transform: translateY(12px) scale(.96); } }
.ans { animation: fadeUp .45s var(--ease-out) .06s both; }
.ans .next { animation: fadeUp .4s var(--ease-out) .05s both; }
.ans .ask-back { animation: fadeUp .45s var(--ease-out) .15s both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
@keyframes fadeIn { from { opacity: 0; } }
.dots { display: inline-flex; gap: 5px; padding: 10px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--md-on-surface-variant); opacity: .35; animation: dot 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: .9; transform: translateY(-4px); } }
.link, .cite, .nav a, .dbar .back { transition: color .2s, text-decoration-color .2s, background-color .2s; }
.row .imgbox { transition: transform .5s var(--md-ease); }
.row:hover .imgbox { transform: scale(1.015); }
.row h3 { transition: text-decoration-color .2s; }
.works.anim .row:not([hidden]) { animation: fadeUp .4s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
.filter button { transition: color .2s, border-color .25s var(--md-ease); }
.detail:not([hidden]) { animation: sheetIn .42s var(--ease-out); }
@keyframes sheetIn { from { opacity: 0; transform: translateY(28px); } }
.hdr { transition: background .25s, border-color .25s; }

/* 음성 */
.auto { width: 40px; height: 40px; border-radius: var(--md-full); display: grid; place-items: center; color: var(--md-on-surface-variant); transition: background-color .2s, color .2s; }
.auto:hover { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); }
.auto[aria-pressed="true"] { color: var(--md-primary); }
.auto .ms { font-size: 22px; }
/* 목소리 고르기: 제미나이의 모델 선택처럼 입력창 안 글자 버튼 + 펼침 목록 */
.vpick { position: relative; flex: none; }
.vchip { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 6px 0 12px; border-radius: var(--md-full); color: var(--md-on-surface-variant); font-size: 15px; white-space: nowrap; transition: background-color .2s, color .2s; }
.vchip:hover, .vchip[aria-expanded="true"] { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); color: var(--md-on-surface); }
.vchip .ms { font-size: 20px; transition: transform .2s var(--md-ease); }
.vchip[aria-expanded="true"] .caret-i { transform: rotate(180deg); }
.vchip .vi { display: none; }
.vmenu { position: absolute; right: 0; top: calc(100% + 10px); z-index: 6; width: 300px; max-width: calc(100vw - 32px); overflow-y: auto; padding: 8px 0; border-radius: var(--md-l); background: var(--md-surface);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 12px 32px rgba(31, 75, 150, .16); scrollbar-width: thin; overscroll-behavior: contain; }
.hero.chat .vmenu { top: auto; bottom: calc(100% + 10px); }
.vmenu:not([hidden]) { animation: sugDown .22s var(--ease-out); }
.hero.chat .vmenu:not([hidden]) { animation-name: sugUp; }
.vcap { padding: 14px 20px 6px; font-size: 13px; color: var(--md-on-surface-variant); }
.vcap:first-child { padding-top: 6px; }
.vopt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 16px 8px 20px; text-align: left; transition: background-color .15s; }
.vopt:hover, .vopt:focus-visible { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); outline-offset: -2px; }
.vopt .vt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
.vopt .vt span { font-size: 15px; }
.vopt .vt small { font-size: 13px; color: var(--md-on-surface-variant); }
.vopt .ms { font-size: 20px; color: var(--md-on-surface); visibility: hidden; }
.vopt[aria-checked="true"] .ms, .vopt.playing .ms { visibility: visible; }

    var au = VOICE.audio;
    if (au && au.duration && A._starts) { au.currentTime = A._starts[i] / A._chars * au.duration; mark(A, i); }
    else if (!TTS_ENDPOINT) speak(A, VOICE.btn, i);   // 브라우저 음성은 그 문장부터 다시 읽는다
  }
  function stopVoice() {
    VOICE.run++;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (VOICE.audio) { VOICE.audio.pause(); VOICE.audio = null; }
    document.querySelectorAll('.sn.reading').forEach(function (n) { n.classList.remove('reading'); });
    setBtn(VOICE.btn, false); VOICE.btn = null;
  }
  function viaBrowser(said, A, run, from) {
    return new Promise(function (res) {
      var i = from || 0;
      (function next() {
        if (run !== VOICE.run || i >= said.length) { res(); return; }
        var u = new SpeechSynthesisUtterance(speakText(said[i]));
        u.lang = 'ko-KR'; if (VOICE.voice) u.voice = VOICE.voice; u.rate = 1.02 * VOICE.rate;
        var me = i; u.onstart = function () { if (run === VOICE.run) mark(A, me); };
        u.onend = u.onerror = function () { i++; next(); };
        speechSynthesis.speak(u);
      })();
    });
  }
  function viaServer(said, A, run) {
    var text = said.map(speakText).join(' ');
    return fetch(TTS_ENDPOINT, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: text, voice: VOICE.name }) })
      .then(function (r) { if (!r.ok) throw 0; return r.blob(); })
      .then(function (blob) {
        if (run !== VOICE.run) return;
        var au = new Audio(URL.createObjectURL(blob)); VOICE.audio = au; au.playbackRate = VOICE.rate;
        var ends = [], c = 0; said.forEach(function (x) { c += speakText(x).length + 1; ends.push(c); });
        A._starts = [0].concat(ends.slice(0, -1)); A._chars = c;
        au.ontimeupdate = function () { if (!au.duration) return; var pos = au.currentTime / au.duration * c, i = 0; while (i < ends.length - 1 && pos > ends[i]) i++; mark(A, i); };
        return new Promise(function (res, rej) { au.onended = res; au.onerror = rej; au.play().catch(rej); });
      });
  }
  function speak(A, btn, from) {
    stopVoice(); var said = A._said || []; if (!said.length) return;
    var run = VOICE.run; VOICE.btn = btn; setBtn(btn, true);
    var go = TTS_ENDPOINT ? viaServer(said, A, run).catch(function () { return run === VOICE.run && BROWSER_VOICE && 'speechSynthesis' in window ? viaBrowser(said, A, run) : null; }) : viaBrowser(said, A, run, from);
    go.finally(function () { if (run === VOICE.run) { mark(A, -1); setBtn(btn, false); VOICE.btn = null; } });
  }
  function setAuto(on) {
    VOICE.auto = on; try { localStorage.setItem('hj-autoread', on ? '1' : '0'); } catch (e) {}
    var b = $('#auto-read'); if (b) { b.setAttribute('aria-pressed', String(on)); b.querySelector('.ms').textContent = on ? 'volume_up' : 'volume_off'; b.title = on ? '답 읽어 주기 켜짐' : '답 읽어 주기 꺼짐'; }
    if (!on) stopVoice();
  }

  // 목소리 고르기: 고르면 바로 그 목소리로 한 문장 들려준다(목록은 열어 둔 채로 여러 개 비교)
  var VM = $('#vmenu'), VC = $('#vchip');
  function renderVoices() {
    VC.querySelector('.vname').textContent = VNAME[VOICE.name];
    VC.title = '목소리: ' + VNAME[VOICE.name];
    VM.innerHTML = VOICES.map(function (g) {
      return '<div class="vcap">' + g[0] + '</div>' + g[1].map(function (v) {
        return '<button class="vopt" type="button" role="menuitemradio" aria-checked="' + (v[0] === VOICE.name) + '" data-voice="' + v[0] + '"><span class="vt"><span>' + v[1] + '</span><small>' + v[2] + '</small></span><span class="ms" aria-hidden="true">check</span></button>';
      }).join('');
    }).join('') + (TTS_ENDPOINT ? '' : '<p class="vnote">음성 서버를 연결하면 고른 목소리로 들려요.</p>');
  }
  function openVoices() {
    closeSug(); renderVoices(); VM.hidden = false; VC.setAttribute('aria-expanded', 'true');
    var chat = $('#hero').classList.contains('chat'), r = VC.getBoundingClientRect();
    VM.style.maxHeight = Math.max(200, Math.min(440, chat ? r.top - 26 : window.innerHeight - r.bottom - 26)) + 'px';
    var on = VM.querySelector('[aria-checked="true"]'); if (on) { on.scrollIntoView({ block: 'nearest' }); on.focus({ preventScroll: true }); }
  }
  function closeVoices(back) { if (VM.hidden) return; VM.hidden = true; VC.setAttribute('aria-expanded', 'false'); if (back) VC.focus(); }
  function chooseVoice(name, row) {
    VOICE.name = name; try { localStorage.setItem('hj-voice', name); } catch (e) {}
    VM.querySelectorAll('.vopt').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.voice === name)); b.classList.remove('playing'); });
    VC.querySelector('.vname').textContent = VNAME[name]; VC.title = '목소리: ' + VNAME[name];
    if (!TTS_ENDPOINT) return;
    stopVoice(); var run = VOICE.run; row.classList.add('playing'); row.querySelector('.ms').textContent = 'graphic_eq';
    var done = function () { row.classList.remove('playing'); row.querySelector('.ms').textContent = 'check'; };
    fetch(TTS_ENDPOINT, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: VSAY, voice: name }) })
      .then(function (r) { if (!r.ok) throw 0; return r.blob(); })
      .then(function (blob) {
        if (run !== VOICE.run) return;
        var au = new Audio(URL.createObjectURL(blob)); VOICE.audio = au;
        return new Promise(function (res, rej) { au.onended = res; au.onerror = rej; au.play().catch(rej); });
      }).catch(function () {}).then(done);
  }
  VM.addEventListener('keydown', function (e) {
    var items = [].slice.call(VM.querySelectorAll('.vopt')), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeVoices(true); }
  });
  document.addEventListener('click', function (e) { if (!$('#vpick').contains(e.target)) closeVoices(); });

  var BUSY = false, TH = null, stick = true;
  function toBottom() { if (TH && stick) TH.scrollTop = TH.scrollHeight; }
  function ask(q, shown) {
    q = (q || '').trim(); if (!q || BUSY) return;
    BUSY = true; closeSug(); closeVoices(); IN.value = ''; hasText(); stopVoice();
    var H = $('#hero');
    if (!H.classList.contains('chat')) {
      var before = ASK.getBoundingClientRect();
      H.classList.add('chat'); window.scrollTo({ top: 0 });
      if (!RM) {   // 질문창이 가운데에서 아래로 미끄러져 내려간다
        var after = ASK.getBoundingClientRect();
        ASK.animate([{ transform: 'translateY(' + (before.top - after.top) + 'px)' }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2, 0, 0, 1)' });
      }
    }
    TH = $('#thread'); stick = true;
    TH.querySelectorAll('.ask-back').forEach(function (n) { n.remove(); });   // 지난 되묻기는 정리
    var me = document.createElement('p'); me.className = 'msg-q'; me.textContent = shown || q; TH.appendChild(me);
    var A = document.createElement('div'); A.className = 'ans';
    A.innerHTML = '<div class="body"><span class="dots" aria-label="생각하는 중"><i></i><i></i><i></i></span></div>'; TH.appendChild(A);
    var body = A.firstChild; if (TH) TH.scrollTo({ top: TH.scrollHeight, behavior: RM ? 'auto' : 'smooth' });
    var paint = function (raw) { body.innerHTML = parse(raw).html || '<span class="dots" aria-label="생각하는 중"><i></i><i></i><i></i></span>'; toBottom(); };
    var done = function (raw) { var r = parse(raw); body.innerHTML = r.html; A._said = r.said; A.insertAdjacentHTML('beforeend', tail(r)); toBottom();
      if (VOICE.auto && VOICE.ok) speak(A, A.querySelector('[data-listen]')); };
    llm(q, paint).then(function (raw) {
      if (!raw) raw = presetText(q);
      TURNS.push({ role: 'user', content: q }, { role: 'assistant', content: raw });
      done(raw);
    }).catch(function (e) {
      var code = e && e.code;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared') { SAMPLE = null; done(presetText(q)); }
      else if (code === 'rate_limited') body.innerHTML = (e.text ? parse(e.text).html : '') + '<p class="meta">질문이 잠깐 몰렸어요. 조금 뒤에 다시 물어봐 주세요.</p>';
      else if (code !== 'cancelled') body.innerHTML = (e && e.text ? parse(e.text).html : '') + '<p class="meta">답하다가 연결이 끊겼어요. 한 번 더 물어봐 주세요.</p>';
    }).finally(function () { BUSY = false; if (window.matchMedia('(hover: hover)').matches) IN.focus({ preventScroll: true }); });
  }
  $('#thread').addEventListener('scroll', function () { var t = this; stick = t.scrollHeight - t.scrollTop - t.clientHeight < 40; }, { passive: true });
  function chooseTeam(k) {
    if (k === 'skip') { var b = $('.ask-back'); if (b) b.remove(); return; }
    CTX.team = k; fitTeam(k);
    var t = TEAMS[k];
    ask('저는 ' + t.label + ' 팀이에요. 이 팀이 먼저 보면 좋을 걸 추천해 주세요. 추천 순서: ' + t.order.map(function (id) { return BY[id].name; }).join(', ') + ' · 먼저 짚을 근거: ' + t.first.join(', '), t.label + ' 팀이에요');
  }

  /* ── 많이 묻는 질문 목록 ───────────────────────────── */
  var IN = $('#ask-input'), SUG = $('#sug'), ASK = $('#ask'), sel = -1;
  function openSug() {
    var v = norm(IN.value);
    var list = PRESETS.filter(function (p) { return !v || norm(p.q).indexOf(v) > -1 || p.keys.some(function (k) { return v.indexOf(k) > -1; }); });
    if (!list.length) { closeSug(); return; }
    sel = -1;
    SUG.innerHTML = list.map(function (p, i) { return '<li role="option" id="sug-' + i + '" data-q="' + esc(p.q) + '">' + esc(p.q) + '</li>'; }).join('');
    SUG.hidden = false; ASK.classList.add('open'); IN.setAttribute('aria-expanded', 'true');
    // 화면 높이가 낮은 노트북에서도 목록이 화면 안에 들어오게
    var chat = $('#hero').classList.contains('chat'), r = ASK.getBoundingClientRect();
    SUG.style.maxHeight = Math.max(160, chat ? r.top - 80 : window.innerHeight - SUG.getBoundingClientRect().top - 16) + 'px';
  }
  function closeSug() { SUG.hidden = true; ASK.classList.remove('open'); IN.setAttribute('aria-expanded', 'false'); IN.removeAttribute('aria-activedescendant'); }
  function moveSug(d) {
    var items = SUG.querySelectorAll('[role=option]'); if (!items.length) return;
    sel = (sel + d + items.length) % items.length;
    items.forEach(function (li, i) { li.classList.toggle('on', i === sel); });
    IN.setAttribute('aria-activedescendant', items[sel].id);
  }
  IN.addEventListener('focus', function () { if (!$('#hero').classList.contains('chat')) openSug(); });
  function hasText() { $('#ask-form').classList.toggle('has', !!IN.value.trim()); }
  IN.addEventListener('input', function () { hasText(); openSug(); });
  IN.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (SUG.hidden) openSug(); moveSug(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSug(-1); }
    else if (e.key === 'Escape') closeSug();
    else if (e.key === 'Enter' && sel > -1 && !SUG.hidden) { e.preventDefault(); ask(SUG.querySelectorAll('[role=option]')[sel].dataset.q); }
  });
  SUG.addEventListener('mousedown', function (e) { var li = e.target.closest('[data-q]'); if (li) { e.preventDefault(); ask(li.dataset.q); } });
  document.addEventListener('click', function (e) { if (!ASK.contains(e.target)) closeSug(); });
  $('#ask-form').addEventListener('submit', function (e) { e.preventDefault(); if (IN.value.trim()) ask(IN.value); else IN.focus(); });

  /* ── 클릭 위임 ─────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    var sp = e.target.closest('[data-speed]'); if (sp) { nextRate(sp); return; }
    var sn = e.target.closest('.ans.speaking .sn');
    if (sn && !e.target.closest('[data-cite]') && VOICE.btn && VOICE.btn.closest('.ans') === sn.closest('.ans')) { seekTo(sn.closest('.ans'), +sn.dataset.sn); return; }
    var lb = e.target.closest('[data-listen]');
    if (lb) { var A = lb.closest('.ans'); if (VOICE.btn === lb) stopVoice(); else speak(A, lb); return; }
    if (e.target.closest('#auto-read')) { setAuto(!VOICE.auto); return; }
    if (e.target.closest('#vchip')) { if (VM.hidden) openVoices(); else closeVoices(); return; }
    var vo = e.target.closest('.vopt'); if (vo) { chooseVoice(vo.dataset.voice, vo); return; }
    var t = e.target.closest('[data-open],[data-close],[data-cite],[data-act],[data-team],[data-q],[data-f],[data-scroll],[data-top],#fit-reset,#email');
    if (!t || t.closest('#sug')) return;
    if (t.dataset.open) { e.preventDefault(); openDetail(t.dataset.open); }
    else if (t.hasAttribute('data-close')) closeDetail();
    else if (t.dataset.cite) goCard(t.dataset.cite);
    else if (t.dataset.act) ACTIONS[t.dataset.act](t.dataset.t);
    else if (t.dataset.team) chooseTeam(t.dataset.team);
    else if (t.dataset.q) ask(t.dataset.q);
    else if (t.dataset.f) setFilter(t.dataset.f);
    else if (t.dataset.scroll) { e.preventDefault(); scrollTo(t.dataset.scroll); }
    else if (t.hasAttribute('data-top')) { e.preventDefault(); closeDetail(); window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); }
    else if (t.id === 'fit-reset') { ORDER = P.map(function (p) { return p.id; }); renderWorks(); $('#fit').hidden = true; }
    else if (t.id === 'email') {
      var sub = $('#email-sub');
      var done = function (ok) { sub.textContent = ok ? '복사했어요' : '주소를 길게 눌러 복사해 주세요'; setTimeout(function () { sub.textContent = '누르면 복사돼요'; }, 1600); };
      try { navigator.clipboard.writeText(t.dataset.copy).then(function () { done(true); }, function () { done(false); }); } catch (err) { done(false); }
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !D.hidden) closeDetail(); });
  window.addEventListener('scroll', function () { $('#hdr').classList.toggle('on', window.scrollY > 8); }, { passive: true });

  if (!VOICE.ok) $('#auto-read').hidden = true; else setAuto(VOICE.auto);
  renderVoices();
  function fromHash() { var h = location.hash.slice(1); if (BY[h]) openDetail(h); else if (!h) closeDetail(); }
  window.addEventListener('hashchange', fromHash); fromHash();
})();
</script>
