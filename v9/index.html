# 한정민 AI 지식 — 본인 답변

받은 날: 2026-11-11(1~9), 2026-11-12(10~20) · 출처: 한정민이 큰 질문에 직접 쓴 답(원문 `한정민AI_본인답변_원문.md`). 원문에 있는 것만 줄여 옮겼다. 말할 때는 사실과 한정민이 고른 핵심 말은 그대로 두고, 문장은 질문에 맞게 새로 쓰며 여러 칸을 엮는다(SKILL 1.9). 한정민이 "아직 정리 중"이라고 한 것은 말하지 않는다.

## 1. 가장 오래 붙잡은 고민
- 고민: 한정민 님 자신이 좋다고 생각한 것이 사용자에게도 좋은가?
- 디자인을 배우려고 입학했지만, 프로젝트를 할수록 화면을 만드는 것보다 왜 이 화면이 필요한지, 사용자가 어떤 순서로 행동하는지를 생각하는 데 더 흥미를 느낌.
- 예전 습관: 자신이 불편한 것을 곧바로 사용자 문제로 받아들이거나, 문제를 발견하자마자 해결안부터 떠올림. 빨리 진행되는 것 같았지만 근거를 갖춘 건 아니었음.
- 코레일톡에서 배운 것: 자신의 경험은 문제를 발견하는 출발점일 수 있지만 문제를 확정하는 근거는 될 수 없다. 지금은 관찰한 사실과 자신의 해석을 구분하고, 사용자가 실제로 어디서 막히는지 확인한 뒤 방향을 정함.
- 좋아하는 말: "형태는 기능을 따른다." 사용자의 목적을 먼저 이해하고, 그 목적에 맞춰 정보의 순서 · 화면 흐름 · 인터랙션을 설계.
- 되고 싶은 기획자: 사용자 문제와 구현 · 운영의 제약을 함께 이해하고, 팀에 선택의 이유를 설명할 수 있는 기획자.

## 2. 한정민이 스스로 말한 약점 (이것만 말한다)
- 아직은 확인보다 해결을 서두를 때가 있다. 그래서 "배고프다"에는 첫 생각을 그대로 믿지 않고 한 번 더 확인하겠다는 다짐이 담겨 있다.
- 자기 의견을 설명하는 데 집중하면 다른 사람 생각을 충분히 듣지 못할 수 있다. 그래서 반대 의견을 제안을 막는 말이 아니라 자신이 놓친 조건을 알려 주는 의견으로 본다.
- 아직 경험이 풍부한 기획자는 아니다. 모르는 부분을 그럴듯한 말로 넘기기보다 질문하고, 확인할 수 있는 형태로 만들려 한다.
- (2026-11-12 추가) 디테일을 오래 붙잡는 편이다. 그래서 모든 불일치를 같은 중요도로 보지 않고 사용자의 이해와 행동에 영향을 주는 것부터 정돈하고, 정해진 범위와 마감 안에서 완료 기준을 지키는 연습을 하고 있다(16 · 19번).

## 3. 기획 방식을 가장 잘 보여 주는 프로젝트: 코레일톡 UX 개선
- 한정민이 자기 기획 방식을 가장 잘 설명할 수 있는 프로젝트로 고름.
- 맥락: 미디어 프로토타이핑 수업의 팀 프로젝트. 한정민의 역할: 템플릿 제작 · 사용성 평가 기획. 팀 인원 · 기간은 자료에 없음.
- 시작: 승차권 조회 관련 기능이 여러 영역에 나뉘어 있어 원하는 승차권을 확인하려고 화면을 반복 탐색함. 처음엔 버튼 위치를 바꾸거나 눈에 띄게 하면 될 것 같았음.
- 막힌 곳: 자신이 익숙하지 않아 불편한지, 다른 사용자도 겪는 문제인지 구분할 수 없었음. 그래서 개선안을 바로 확정하지 않고, 실제 사용자에게 과제를 주고 어느 화면을 다시 확인하고 어디로 이동하는지 관찰함.
- 평가에서 본 것: 성공 여부보다 사용자가 기능이 어디 있을 거라 예상하는지. 기능을 이해하지 못하는 문제보다 어디서 찾아야 할지 예측하기 어려운 문제가 드러남.
- 팀의 개선 방향: 시각 요소만 고치지 않고 사용자 목적에 맞게 기능을 묶고 탐색 흐름을 단순화.
- 한정민이 직접 판단한 것: 개인적인 불편을 곧바로 해결안으로 옮기지 않고 평가로 확인해야 한다는 것, 평가에서 사용자의 탐색 행동을 봐야 한다는 것. 전체 개선안은 팀의 결과다.
- 결과: 개선 후 다시 평가함. 탐색 시간이 몇 퍼센트 줄었다거나 실제 서비스 성과는 말하지 않는다. "수업 프로젝트 안에서 개선안을 만들고 다시 확인한 범위"까지가 결과.
- 아쉬움: 평가 결과와 수정 이유를 더 체계적으로 남기지 못함. 다시 한다면 평가 전에 확인 기준을 정하고, 개선 전후를 같은 과제 · 같은 기준으로 비교하겠다고 함. 이후 결과물뿐 아니라 왜 바꿨고 무엇으로 확인했는지까지 남기는 일을 중요하게 여김.

## 4. 팀에서의 한정민
- 바라는 평가: 아이디어를 말하는 데서 끝내지 않고 어떻게 구체화할지까지 생각하는 사람. 의견이 나오면 화면이나 흐름으로 정리해 보고, 말로 전달이 어려우면 직접 만들어 확인함.
- 의견이 다를 때: 어느 쪽이 좋은지 바로 정하지 않고, 각자 무엇을 중요하게 보는지(사용자 편의 · 구현 난이도 · 시각 완성도) 먼저 이해함.
- 의견이 부딪칠 때 기준: "누가 제안했나"가 아니라 "이번 프로젝트에서 무엇을 해결하려는가". 사용자에게 필요한가, 우리 시간과 범위에서 구현할 수 있나, 확인할 방법이 있나로 비교함. 말로 합의가 어려우면 간단한 화면이나 프로토타입으로 만들어 비교함.
- 말하지 않는 것: 특정 프로젝트에서 실제로 부딪친 장면과 최종 결정. 한정민이 아직 정리 중이고, 태도와 실제 사건을 섞어 과장하지 않기 위해서.

## 5. 학교 밖에서 배운 것
- 바이칼 휘트니스 운영 업무에서 인수인계 방식을 정리함. 현장에서는 한 사람이 잘 처리하는 것만으로 부족하고, 다음 근무자가 상황을 이해하고 이어서 처리할 수 있어야 함. 한정민의 말: "일을 끝내는 것에는 다른 사람이 이어받을 수 있도록 정보를 남기는 것까지 포함된다."
- 말하지 않는 것: 어떤 문제가 반복됐는지, 만든 항목과 규칙, 이후 무엇이 달라졌는지(누락 감소 · 응대 시간 감소 등). 실제 기록으로 정리하기 전.
- 카페 · 물류 현장: 사용자의 행동뿐 아니라 운영하는 사람의 상황을 생각하게 됨. 안내가 이해하기 쉬운지, 바쁜 상황에서도 필요한 정보를 찾을 수 있는지, 담당자가 바뀌어도 일이 이어지는지.
- 화면설계서와 연결: 이해한 걸 적는 데서 끝내지 않고, 다른 사람이 같은 의미로 이해하고 실행할 수 있게 씀.
- 군 생활: 한정민이 공개할 경험과 배운 점을 정한 뒤 추가. 그 전에는 이력서 사실(병장 만기 전역)까지만.

## 6. AI와 일하는 원칙
- 원칙: AI에 작업을 맡겨도 판단까지 넘기지 않는다. AI는 자료 정리 · 대안 넓히기 · 아이디어를 빠르게 구현하는 데 씀. 어떤 문제를 풀지, 어떤 방향을 고를지, 결과가 사용자 목적에 맞는지는 한정민이 확인함.
- "이건 아니다" 싶었던 경험: HTML 화면을 PDF로 내보낼 때 화면에선 맞던 배치가 PDF에서 달라지거나 A4 영역에서 잘렸고, 한 페이지에 맞추다 글자가 너무 작아짐. 원하는 결과를 설명했다고 결과물이 그 조건을 충족하는 건 아니라는 걸 느낌.
- 그 뒤 바꾼 것: "잘 만들어줘" 대신 유지할 내용 · 배치 · 출력 크기 · 수정 범위 · 확인 기준을 구체적으로 전달함. 결과는 설명만 믿지 않고 실제 화면과 출력물로 확인함.
- 이 포트폴리오의 AI 가이드: 처음엔 LLM이 프로젝트를 설명하면 탐색이 편해질 거라 생각했지만, 대화 기능이 있다는 것만으로 방문자의 불편을 해결했다고 볼 수 없었음. 그래서 검토자가 필요한 역량을 찾고 한정민의 개인 기여와 판단 근거를 확인하는 과정을 어떻게 줄일지부터 다시 생각하는 중.
- 이 AI 가이드가 지킬 것: 없는 성과나 역할을 만들지 않기, 자료가 없으면 없다고 말하기, 구현한 것 · 기획한 것 · 검증한 것 · 아직 확인 못 한 것을 구분하기. Claude 등 도구와 일하는 방식도 실제로 쓰고 확인한 방식까지만 말하기.

## 7. 하고 싶은 일
- 직무: UI/UX 서비스 기획.
- 풀고 싶은 문제: 사용자가 목적을 이루는 과정의 불편. 기능이 없어서 생기는 문제뿐 아니라, 기능은 있는데 찾기 어렵거나 정보 순서가 맞지 않아 사용자가 헤매는 문제.
- 분야: 특정 산업은 아직 좁히는 중. 사용자 상황을 조사하고 해결안을 실제로 만들어 확인할 수 있는 팀에서 일하고 싶음.
- AI 서비스에 관심이 많음. AI를 어디에 넣을지보다, 어떤 상황에서 사용자에게 도움이 되고 어떤 입력을 받아 어떤 결과를 줘야 하는지를 설계하고 싶음.
- 기여할 수 있는 것: 디자인 배경 · 기획 · AI를 활용한 구현을 연결함. 화면의 위계와 전달 방식을 고려하며 구조를 설계하고, 설명이 어려운 흐름은 직접 작동하는 형태로 만들어 확인함.

## 8. 기억되고 싶은 모습
- "자기 판단의 이유를 설명할 수 있고, 직접 만들어 확인하는 기획자."
- 헝그리의 뜻: 더 나은 결과를 찾으려는 태도. 보여 주는 행동은 개인적인 불편을 사용자 평가로 확인하기 → 설계한 흐름을 AI로 구현하기 → 예상과 다르면 다시 수정하기.
- 이렇게 보이면 안 됨: 도구 이름을 많이 아는 것으로 AI 역량을 주장하는 모습, 팀의 결과를 전부 혼자 만든 것처럼 보이는 모습, 화려한 인터랙션 때문에 내용과 실제 기여를 확인하기 어려운 모습.

## 9. 일 밖에서 좋아하는 것
- 여러 분야의 기획을 찾아보고 적용해 보는 걸 좋아함: OTT · 영상 · SNS · 요리 · 스포츠 · 팀 관리 등. 사람들이 무엇에 관심을 갖고 어떤 경험에 몰입하는지 살펴보는 게 재미있고, 다른 분야에서 발견한 방식을 작업이나 일상에 적용해 봄.
- 가장 좋아하는 스포츠: 축구(직접 뛰는 것 · 보는 것 모두). 각자의 역할과 움직임이 맞아야 팀 전체의 플레이가 좋아진다는 점, 공을 가진 사람뿐 아니라 공간을 만들고 동료를 돕고 상황에 맞춰 역할을 바꾸는 사람도 중요하다는 점에서 축구의 협업을 좋아함.
- 좋아하는 팀: 파리 생제르맹 · 아틀레티코 마드리드 · 토트넘. 이강인 · 손흥민을 좋아해서 관심을 갖게 된 팀도 있고, 각 팀의 브랜딩에도 매력을 느낌. 경기력 외에 팀의 색깔과 이야기, 팬과 소통하는 방식이 사람의 마음을 움직이고 애정을 갖게 만드는 점이 흥미롭다고 함.
- 선수에 대한 일반 사실(AI가 말할 때 주의): 손흥민은 토트넘에서 2015년부터 10년 동안 뛰었고 2025년 8월 미국 LAFC로 옮겼다. 지금 소속은 다시 바뀌었을 수 있으니 "지금 토트넘에서 뛴다"고 말하지 않고 "토트넘에서 오래 뛰었다"까지만 말한다. 이강인도 지금 소속 팀은 단정하지 않는다(한정민이 PSG를 좋아하게 된 계기로만 말한다).
- 좋아하는 선수: 손흥민(겸손함 · 꾸준한 노력 · 몰입하는 태도 — 한정민도 현재 결과에 쉽게 만족하기보다 꾸준히 노력하고 해야 할 일에 집중하려 함), 이강인(창의적인 선택과 기술로 축구를 재미있게 풀어 가는 플레이).
- 쉬는 날: 축구, UX 전시 보기, 유명한 맛집 찾아가기, 드라이브. 드라이브는 가끔 지도 위에 펜을 던져 가리킨 곳으로 떠나는 방식으로 목적지를 정함. 익숙하지 않은 장소에서 예상하지 못한 풍경이나 공간을 만나는 재미.
- 머리가 복잡하거나 집중이 안 될 때: 축구를 자주 함. 뛰는 동안 눈앞의 상황에 집중하면서 잡생각이 사라지고, 뛰고 나면 입맛도 돌아오고 잠도 잘 옴. 몸과 생각을 환기하는 방법.
- 말할 때: 취미 질문엔 위 사실을 짧게(문장은 새로). 일과의 연결은 한정민이 직접 한 말(축구의 협업, 손흥민의 꾸준함과 몰입, 다른 분야의 기획을 찾아보고 적용)까지만 잇고 더 지어내지 않는다.

## 10. 포트폴리오에서 일부러 뺀 것과 끝까지 지킨 것 (2026-11-12 받음)
- 뺀 것 ①: 내용을 이해하는 데 도움이 되지 않는 장식. 처음엔 시각적으로 멋있어 보이는 화면에 관심이 많았지만, 불필요한 강조선이나 개체가 오히려 정보의 위계를 흐릴 수 있다고 느낌. 그래서 장식을 더하기보다 그리드 · 글자 크기 · 행간 · 여백을 조정하는 데 더 신경 씀.
- 뺀 것 ②: 막연한 자기평가. "AI를 잘 활용한다", "문제 해결력이 좋다" 같은 표현은 그 자체로 충분하지 않다고 봄. 어떤 작업에 AI를 썼고, 무엇을 직접 판단했고, 실제로 어디까지 만들고 확인했는지가 함께 있어야 함. 확인되지 않은 수치나 팀 전체의 결과를 개인 성과처럼 설명하는 것은 넣지 않음.
- 끝까지 지킨 것: 보기 좋은 구성과 판단할 수 있는 내용이 함께 있는 것. 방문자가 필요한 경험을 빠르게 찾고, 더 궁금하면 한정민의 역할 · 선택 이유 · 결과물까지 확인할 수 있어야 함.
- AI 가이드와 캐릭터도 같은 기준으로 만드는 중. '헝그리한'이라는 이름이 기억에 남는 것과 함께, 본 사람이 "왜 그렇게 결정했는지 설명할 수 있고, 직접 만들어 확인하는 사람이구나"라고 느꼈으면 함.
- 말할 때: 이 포트폴리오 · AI 가이드를 왜 이렇게 만들었는지 물으면 이 기준으로 답한다. AI 가이드가 한정민을 칭찬하지 않고 근거를 안내하는 이유도 여기서 나온다.

## 11. 생각이 크게 바뀐 계기: 현대자동차 UX 스튜디오 방문 (2026-11-12 받음)
- 사용자 의견과 UX의 역할을 다시 생각하게 된 계기. 방문 시기와 방문 형태(견학 · 행사 등)는 자료에 없음.
- 가장 인상 깊었던 것: 사용자의 다양한 의견을 카테고리로 분류하고, 그 안에서 공통된 맥락을 찾아 사용자를 이해하고 문제를 정의하는 과정. 의견을 많이 듣는 것만큼, 어떤 상황에서 나온 의견인지 해석하고 무엇을 해결할지 정리하는 일이 중요하다고 느낌.
- 바뀐 생각: 같은 기능에도 사용자의 목적과 상황에 따라 반응이 다를 수 있다. 그래서 의견 하나를 곧바로 기능으로 옮기기보다 누구의 어떤 필요에서 나온 말인지 살펴본다. 사용자 정의와 문제 정의가 명확해야 이후 설계에 기준이 생긴다.
- 사용 시나리오의 중요성: 사용자가 누구인지에서 나아가, 어떤 상황에서 어떤 목적으로 서비스를 쓰고, 그 과정에서 무엇을 보고 판단하고 행동하는지 구체화해야 함. 시나리오로 이용 과정을 따라가면 기능을 따로 볼 때 놓친 불편 · 필요한 정보 · 예외 상황을 살펴볼 수 있음.
- UX에 대한 생각: 화면을 보기 좋고 편리하게 만드는 것뿐 아니라, 사용자가 원하는 목적을 이루도록 서비스의 구조와 흐름을 결정하는 일.
- "형태는 기능을 따른다"를 UX에 적용: 화면의 형태를 정하기 전에 사용자의 목적과 사용 시나리오를 이해하고, 그에 맞춰 필요한 기능 · 정보의 순서 · 인터랙션을 설계함. 방문 이후 사용자 의견이 문제 정의와 시나리오를 거쳐 실제 설계로 어떻게 이어지는지를 더 중요하게 봄.
- 말할 때: 스튜디오에서 본 과정은 한정민이 보고 배운 것이다. 한정민이 현대자동차의 일에 참여했거나 그 회사의 방법을 안다고 말하지 않는다.

## 12. 좋아하는 서비스: 애플뮤직 · 알라미 (2026-11-12 받음)
- 두 서비스 모두 큰 기능보다 사용하는 순간의 기분을 바꿔 주는 작은 경험 때문에 계속 찾게 됨.
- 애플뮤직 좋은 점: Apple Music 1 라디오의 선곡과 진행 방식. 진행자가 영어로 곡을 소개하고 다음 음악으로 넘어가는 분위기. 직접 곡을 고르는 것과 달리 누군가 만들어 놓은 흐름에 자연스럽게 들어가는 느낌. 어떤 음악을 들려주는지만큼 곡 사이를 어떻게 잇고 전달하는지도 경험의 일부라고 봄.
- 애플뮤직 고치고 싶은 점: 영어로 진행되는 곡 소개를 놓칠 수 있음. 진행자가 한 이야기가 궁금할 때 지금 곡과 관련된 소개를 짧은 원문이나 번역으로 확인할 수 있으면 좋겠음. 라디오를 듣는 흐름을 방해하지 않도록 원하는 순간에만 펼쳐 보는 방식.
- 알라미 좋은 점: 아침에 날씨를 읽어 주는 기능. 막 깼을 때는 화면을 보고 정보를 찾는 것도 번거로운데, 음성으로 알려 주면 눈을 제대로 뜨지 않아도 하루 준비에 도움이 됨. 알람을 끄는 순간에서 끝나지 않고 일어난 다음 행동까지 생각한 기능.
- 알라미 고치고 싶은 점: 잠이 덜 깬 상태에서도 기억하기 쉬운 안내. 기온 · 강수를 길게 말하기보다 "어제보다 추워요", "오후에 비가 오니 우산을 챙기세요"처럼 준비할 행동이 떠오르는 한 문장. 안내 길이와 상세 정도를 사용자가 고를 수 있으면 좋겠음.
- 공통으로 좋아하는 것: 사용자가 그 순간 어떤 상태인지 고려한 작은 배려. 기획할 때 기능의 개수뿐 아니라 사용자가 계속 찾게 되는 구체적인 순간을 만들고 싶어 함.
- 말할 때: 고치고 싶은 점은 한정민의 개선 아이디어이고, 실제로 기획 · 제안한 프로젝트가 아니다. 두 서비스의 지금 기능이 바뀌었을 수 있으니 서비스 기능을 단정하지 않는다.

## 13~20 공통 주의 (2026-11-12 받음)
- 아래 13~20은 한정민이 스스로 고른 질문에 쓴 일하는 방식이다. 특정 프로젝트에서 실제로 있었던 장면이 아니다(20번의 예시도 "~하겠습니다"로 쓴 가정). AI는 "한정민은 이렇게 한다고 합니다 / 이렇게 하려고 합니다"로 말하고, 실제 사건처럼 말하지 않는다. 실제 사례를 물으면 ① 먼저 "그 상황의 실제 장면은 아직 자료에 없습니다"라고 한 문장으로 밝히고 ② 한정민의 방식을 짧게 말한 뒤 ③ 가장 가까운 실제 이야기 하나를 잇는다: 계획 · 방향을 바꾼 일이면 15번(이 포트폴리오의 AI 가이드 방향을 바꾼 일), 확인 후 방향을 정한 일이면 3번 코레일톡. 방식을 실제 사례인 것처럼 답하지 않는다.

## 13. 시간은 부족하고 할 일이 많을 때
- 할 일이 많을수록 잠시 멈추고 팀원들과 프로젝트 전체를 점검한다. 급하게 각자 진행하면 원래 의도와 다른 방향으로 가거나 서로 이어지는 부분을 놓칠 수 있어서.
- 순서: ① 해결하려던 문제와 최종 결과를 다시 확인 → ② 남은 작업을 나눔: 목적에 반드시 필요한 일 / 다른 팀원 작업이 이어지려면 먼저 끝내야 하는 일 / 나중에 보완해도 되는 일 → ③ 핵심 흐름과 필수 결과물 먼저, 부가 기능 · 세부 표현은 남은 시간에 맞춰 조정 → ④ 진행 상황과 작업량을 보고 역할을 다시 나눔. 처음 맡은 일을 고집하기보다 병목이 생긴 곳에 힘을 보태고 빠진 작업을 챙김.
- 이유: 점검에 시간을 조금 써도 방향이 어긋난 채 진행하거나 같은 일을 다시 하는 시간을 줄일 수 있음. 마감이 가까울수록 팀이 같은 큰 그림을 보고 중요한 일부터 함께 완성하도록 조율하는 걸 중요하게 봄.
- 포기하는 것: 부가 기능과 세부적인 표현(남은 시간에 맞춰 조정).

## 14. 낯선 분야를 처음 배울 때
- 먼저 그 분야가 어떤 문제를 해결하고 사람들이 왜 쓰는지 본질을 파악함. 모든 용어부터 익히기보다 실제 사례를 보며 "이 프로젝트에서 가장 중요한 것은 무엇인가?", "이 결과가 나오려면 어떤 조건이 필요한가?"를 생각함.
- 작게라도 직접 해 봄: 웹 · 인터랙션은 간단히 만들어 보고, 새 기획 방식은 진행 중인 작업에 적용해 봄. 읽을 땐 이해했다고 생각한 것도 직접 해 보면 모르는 부분이 분명해짐.
- 막히면: 어디까지 이해했고 어디부터 설명할 수 없는지 정리 → 자료나 AI로 찾아보고, 실제 사례와 비교하거나 다른 사람에게 질문. AI가 정리한 답도 직접 적용해 자기 상황에 맞는지 확인함.
- 다른 분야(OTT · 요리 · 스포츠 등)의 기획을 볼 때 표현 방식뿐 아니라 왜 효과적이었는지, 핵심 원리가 무엇인지 분석하고, 그 원리를 다른 프로젝트의 목적과 조건에 맞게 적용하려 함.

## 15. 자신 있던 생각을 바꾼 일: 이 포트폴리오의 AI 가이드
- 처음 생각: 포트폴리오에 AI를 넣으면 차별성이 생기고 방문자도 편할 것. 질문에 답하는 LLM과 음성 안내 기능 중심으로 구상함.
- 바뀐 계기: 검토자의 불편을 정리하면서. 방문자가 궁금한 건 AI가 얼마나 자연스럽게 답하는지보다 한정민이 어떤 일을 했고, 왜 그렇게 판단했고, 무엇으로 확인할 수 있는지에 가까웠음. 답을 해도 관련 자료를 다시 찾아야 하면 탐색 부담이 충분히 줄지 않음.
- 바꾼 것: AI의 역할을 답변 생성에서 프로젝트의 근거를 연결하고 해당 구간을 안내하는 쪽으로 넓힘.
- 아직 확인 안 된 것: 이것도 해결 가설이라, AI 안내가 실제로 도움이 되는지는 사용자가 탐색하는 과정을 보고 확인해야 한다고 봄. AI는 "효과가 확인됐다"고 말하지 않는다.
- 생각을 바꾸는 기준: 처음 생각이 틀렸다는 사실보다 바꿀 이유를 납득할 수 있는지. 목적에 더 맞는 근거가 있으면 이미 고민한 시간이 아깝더라도 방향을 고침.

## 16. "이 정도면 끝났다"의 기준
- '배고픈 태도'는 끝없이 고친다는 뜻이 아님. 지금 범위에서는 책임 있게 마무리하고, 다음에 더 좋아질 부분을 알고 있는 것에 가까움.
- 완료 기준: 처음 정한 목적을 충족했는가, 중요한 부분을 실제로 확인했는가. 포트폴리오라면 방문자가 한정민이 어떤 기획자인지, 무엇을 직접 했는지, 판단 근거가 어디 있는지 이해할 수 있어야 함.
- 끝났다고 보지 않는 경우: 화면은 완성돼 보여도 주요 버튼이 작동하지 않을 때, PDF로 내보냈을 때 내용이 잘릴 때, 설명과 결과물이 다를 때. 실제로 쓰는 환경에서 확인하는 과정까지 작업에 포함함.
- 그 뒤 개선점: 이해나 사용을 막는 문제는 고치고, 새 기능이나 세부 표현 개선은 다음 작업으로 남김.
- 한정민이 스스로 말한 점: 디테일을 오래 붙잡는 편이라, 정해진 범위와 마감 안에서 이 기준을 지키는 연습이 계속 필요함(2번 약점과 같이 말해도 됨).

## 17. 설명하는 방식
- 핵심을 짧게 말한 뒤 흐름이나 예시로 구체화함. 서비스라면 사용자가 어떤 상황에서 들어와 무엇을 하고 어디까지 도달하는지 순서대로 설명.
- 말만으로는 서로 다른 화면을 떠올릴 것 같으면 와이어프레임이나 간단한 그림을 씀. 움직임이 중요한 인터랙션은 AI로 작게 구현해 직접 보여 주는 방법도 쓰고 싶어 함(실제로 눌러 보면 설명 때 놓친 조건이나 다른 해석이 드러나서).
- 잘 전달되지 않으면 같은 말을 길게 반복하지 않고, 상대가 어디까지 이해했는지 확인하고 설명 방식을 바꿈. 개발자에게 필요한 동작 조건과 처음 보는 사람에게 필요한 맥락은 다르다고 봄.
- 기준: 설명을 마쳤는지보다 상대가 같은 의미로 이해하고 다음 행동을 할 수 있는지.

## 18. 결과가 좋아 보여도 선택하지 않는 방식
- 근거가 부족한 내용을 확실한 것처럼 말하기, 자기 기여를 실제보다 크게 보이게 하기. 팀 프로젝트 완성도가 높아도 자기가 맡은 부분을 구분해 설명해야 하고, 테스트했다고 효과까지 검증됐다고 말하면 안 된다고 봄.
- AI가 만든 결과도 요구사항에 맞는지 확인하지 않았다면 그대로 전달하지 않음. 설명하거나 확인할 수 없는 부분은 범위를 밝힘.
- 사용자에게 불필요한 혼란을 주며 눈길만 끄는 방식도 조심함. 포트폴리오의 캐릭터와 인터랙션도 재미있게 만들고 싶지만, 내용 탐색을 방해하면 줄이거나 바꿈.
- 결과를 돋보이게 하는 것만큼 그 결과가 어떻게 나왔는지 설명할 수 있는 상태를 중요하게 봄. (이 AI 가이드의 말하기 원칙과 같은 뿌리.)

## 19. 남들은 넘기는데 유독 신경 쓰는 것
- 작은 불일치: 같은 위계 제목의 높이가 다를 때, 글자 간격과 행간이 일정하지 않을 때, 화면에서 본 배치가 출력물에서 달라질 때.
- 사용 흐름이 끊기는 순간: 다음 행동을 하려는 순간 필요한 정보가 없을 때, 설명을 듣고도 어디를 눌러야 할지 다시 찾아야 할 때.
- 애플뮤직 라디오의 곡 사이 진행, 알라미의 날씨 음성 안내를 좋아하는 것도 같은 관심. 핵심 기능 사이의 작은 전달 방식이 전체 경험의 기분과 편리함을 바꾼다고 느낌.
- 다루는 법: 세부 작업에 시간을 오래 쓰게 되기도 해서, 모든 불일치를 같은 중요도로 보지 않고 사용자의 이해와 행동에 영향을 주는 부분부터 정돈함. 발견한 작은 차이가 실제로 어떤 불편을 만드는지 설명할 수 있어야 한다고 봄.

## 20. 계획이 틀어지거나 예상 못 한 문제가 생기면
- 처음엔 당황하고 답답함을 느낌. 그래도 급하게 해결책부터 정하지 않고, 무엇이 달라졌고 목표에 어떤 영향을 주는지 먼저 확인함. 반드시 지켜야 하는 조건과 조정할 수 있는 조건을 나누면 대응 순서가 분명해짐.
- 한정민이 든 예시(가정): 마감이 가까운데 핵심 기능 구현이 늦어지면 → 팀과 현재 상태를 공유하고 그 기능이 사용자 흐름에서 어떤 역할인지 다시 봄 → 이후 작업에 영향을 주면 우선순위를 높이고 역할을 다시 나눔, 부가적이면 범위를 줄이거나 다음 단계로 미룸.
- 무엇을 바꾸고 무엇을 유지할지 팀이 함께 이해하는 게 중요. 결정한 내용과 역할을 다시 정리해 공유함.
- 기준: 처음 계획을 그대로 지키는 것보다 바뀐 조건에서도 원래 목적을 이룰 경로를 찾는 것. 문제가 생겼다는 사실을 빨리 인정하고 공유하는 게 출발점.

    hgEach(function (h) { if (h.react) h.react(k, m); else h.set(k); });
  }
  function hgSafeIdle(delay) {
    clearTimeout(HG_IDLE_T);
    HG_IDLE_T = setTimeout(function () { hg('idle'); }, Math.max(delay || 0, HG_REACT_UNTIL - Date.now()));
  }
  // 문장마다 읽기 번호(said)가 한 줄 안에서 마침표로 더 나뉘므로, 문장별 감정을 읽기 문장 번호에 맞춰 늘린다(길이가 안 맞으면 비율로)
  function moodsForSaid(sents, moods, n) {
    var out = [];
    sents.forEach(function (x, i) {
      var c = x[2] === 'row' ? 1 : Math.max(1, x[0].replace(/\[\[[^\]]*\]\]/g, '').trim().split(/(?<=[.!?…])\s+/).length);
      for (var j = 0; j < c; j++) out.push(moods[i] || moods[i - 1] || null);
    });
    if (!out.length || !n) return [];
    if (out.length !== n) { var o2 = []; for (var i = 0; i < n; i++) o2.push(out[Math.min(out.length - 1, Math.floor(i * out.length / n))]); out = o2; }
    return out;
  }
  function hgEnd(q, raw) {
    if (!window.HUGI) return;
    var k = /AI 연결이 잠시 어려워요|답이 안 와서 잠깐 끊겼어요/.test(raw) ? 'error'
      : /(고마|감사|대단|최고|멋지|멋있|잘하시|잘하네|귀엽|귀여|훌륭)/.test(q) ? 'praised'
      : /(아직 (못|모르)|잘 (모르|몰라)|몰라요|모르겠|알지 못|자료에 없|직접 (여쭤|들으|물어))/.test(parse(raw).said.join(' ')) ? 'notknow' : 'idle';
    HG_END = k === 'praised' || k === 'notknow' ? k : null;   // 소리로 읽는 중이면 다 읽은 뒤에 반응
    hg(k);
  }
  $('#thread').addEventListener('scroll', function () { var t = this; stick =t.scrollHeight - t.scrollTop - t.clientHeight < 40; }, { passive: true });
  function chooseTeam(k) {
    if (k === 'skip') { var b = $('.ask-back'); if (b) b.remove(); return; }
    CTX.team = k; fitTeam(k);
    var t = TEAMS[k];
    ask('저는 ' + t.label + ' 팀이에요. 이 팀이 먼저 보면 좋을 걸 추천해 주세요. 추천 순서: ' + t.order.map(function (id) { return BY[id].name; }).join(', ') + ' · 먼저 짚을 근거: ' + t.first.join(', '), t.label + ' 팀이에요');
  }

  /* ── 많이 묻는 질문 목록 ───────────────────────────── */
  var IN = $('#ask-input'), SUG = $('#sug'), ASK = $('#ask'), sel = -1;
  function openSug() {
    var v = norm(IN.value);
    var list = PRESETS.filter(function (p) { return !v || norm(p.q).indexOf(v) > -1 || p.keys.some(function (k) { return v.indexOf(k) > -1; }); });
    if (!list.length) { closeSug(); return; }
    sel = -1;
    SUG.innerHTML = list.map(function (p, i) { return '<li role="option" id="sug-' + i + '" data-q="' + esc(p.q) + '">' + esc(p.q) + '</li>'; }).join('');
    SUG.hidden = false; ASK.classList.add('open'); IN.setAttribute('aria-expanded', 'true');
    // 화면 높이가 낮은 노트북에서도 목록이 화면 안에 들어오게
    var chat = $('#hero').classList.contains('chat'), r = ASK.getBoundingClientRect();
    SUG.style.maxHeight = Math.max(160, chat ? r.top - 80 : window.innerHeight - SUG.getBoundingClientRect().top - 16) + 'px';
  }
  function closeSug() { SUG.hidden = true; ASK.classList.remove('open'); IN.setAttribute('aria-expanded', 'false'); IN.removeAttribute('aria-activedescendant'); }
  function moveSug(d) {
    var items = SUG.querySelectorAll('[role=option]'); if (!items.length) return;
    sel = (sel + d + items.length) % items.length;
    items.forEach(function (li, i) { li.classList.toggle('on', i === sel); });
    IN.setAttribute('aria-activedescendant', items[sel].id);
  }
  IN.addEventListener('focus', function () { if (!$('#hero').classList.contains('chat')) openSug(); });
  function hasText() { $('#ask-form').classList.toggle('has', !!IN.value.trim() || !!(PENDING && !PENDING.bad)); }
  IN.addEventListener('input', function () { hasText(); openSug(); if (window.HUGI && !BUSY) window.HUGI.typing(); if (window.HUGI_ORB && !BUSY) window.HUGI_ORB.typing(); });
  IN.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (SUG.hidden) openSug(); moveSug(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSug(-1); }
    else if (e.key === 'Escape') closeSug();
    else if (e.key === 'Enter' && sel > -1 && !SUG.hidden) { e.preventDefault(); ask(SUG.querySelectorAll('[role=option]')[sel].dataset.q); }
  });
  SUG.addEventListener('mousedown', function (e) { var li = e.target.closest('[data-q]'); if (li) { e.preventDefault(); ask(li.dataset.q); } });
  document.addEventListener('click', function (e) { if (!ASK.contains(e.target)) closeSug(); });
  var PENDING = null;   // 붙인 파일 { name, mime, data(base64) }
  function showAtt() {
    var box = $('#att');
    if (!PENDING) { box.hidden = true; box.innerHTML = ''; return; }
    box.hidden = false;
    box.innerHTML = '<span class="ms" aria-hidden="true">description</span><span>' + esc(PENDING.name) + '</span><button type="button" data-att-x aria-label="붙인 파일 빼기"><span class="ms" aria-hidden="true">close</span></button>';
    $('#ask-form').classList.add('has');
  }
  $('#attach').addEventListener('click', function () { $('#attach-file').click(); });
  $('#attach-file').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = '';
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { PENDING = { name: '4MB가 넘는 파일은 붙일 수 없어요', bad: true }; showAtt(); setTimeout(function () { PENDING = null; showAtt(); hasText(); }, 2600); return; }
    var rd = new FileReader();
    rd.onload = function () { PENDING = { name: f.name, mime: f.type, data: String(rd.result).split(',')[1] }; showAtt(); IN.focus(); };
    rd.readAsDataURL(f);
  });
  $('#ask-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = IN.value.trim();
    if (PENDING && !PENDING.bad) {
      var f = PENDING; PENDING = null; showAtt();
      ask(v || '붙인 채용 공고를 요건별로 한정민의 근거와 비교해 표로 정리해 주세요', (v || '채용 공고 정리해 주세요') + ' · 파일: ' + f.name, { file: { name: f.name, mime: f.mime, data: f.data } });
      return;
    }
    if (v.length > 600) { ask('이 채용 공고를 요건별로 한정민의 근거와 비교해 표로 정리해 주세요', '채용 공고를 붙여 넣었어요 (' + v.length + '자)', { doc: v }); return; }
    if (v) ask(v); else IN.focus();
  });
  restoreChat();   // 같은 탭에서 새로고침했으면 대화를 다시 그린다

  /* 화면 이벤트 → 허기 반응(LLM을 거치지 않고 바로). 답 만드는 중 · 읽어 주기 중 · 모션 줄이기면 하지 않는다. 오래 기다림(longIdle → 졸림)은 hugi.js가 25초 무입력에 이미 처리한다 */
  function hgCan() { return !!window.HUGI && !BUSY && !RM && !document.querySelector('.ans.speaking'); }
  function hgEvent(k) { try { if (hgCan()) hg(k); } catch (e) {} }
  var nudgeT = null, ERRED = false;
  function nudgeStop() { clearTimeout(nudgeT); nudgeT = null; }
  function nudgeStart() { nudgeStop(); nudgeT = setTimeout(function () { nudgeT = null; hgEvent('nudge'); }, 45000); }   // 답이 끝나고 45초 무입력이면 한 번(대화가 멈춤 → 배고픔)
  IN.addEventListener('input', nudgeStop);
  try {   // 다시 찾아옴: 저장된 대화가 있거나 이 브라우저에 온 적이 있으면 첫 인사 뒤에 한 번
    var back = !!SAVED.length; try { back = back || localStorage.getItem('hg-visited') === '1'; localStorage.setItem('hg-visited', '1'); } catch (e) {}
    if (back) setTimeout(function () { hgEvent('revisit'); }, 5000);
  } catch (e) {}
  if ('IntersectionObserver' in window) {   // 프로젝트 구역에 처음 들어올 때 한 번(대화 중이면 건너뜀)
    var pj = $('#projects');
    // 구역이 화면 높이의 35% 이상을 채우면 한 번(구역이 화면보다 길어도 동작하게: 구역 비율이 아니라 화면 비율로 본다)
    var hgSeen = function (el, k) {
      if (!el) return; var th = []; for (var i = 0; i <= 50; i++) th.push(i / 50);
      var o = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting && e.intersectionRect.height >= Math.min(innerHeight, e.boundingClientRect.height) * .35) { o.disconnect(); hgEvent(k); } }); }, { threshold: th });
      o.observe(el);
    };
    hgSeen(pj, 'secProject');
    // 질문창이 화면 밖이면 허기를 오른쪽 아래 구석으로, 첫 화면으로 돌아오면 다시 질문창 옆으로(2026-11-13 v9 세션, 사용자 "알아서 해")
    var hgRoot = $('#hugi-root');
    if (hgRoot) {
      var askIo = new IntersectionObserver(function (es) {
        var away = !es[es.length - 1].isIntersecting;
        if (away === hgRoot.classList.contains('hg-float')) return;
        hgRoot.classList.toggle('hg-float', away);
        window.dispatchEvent(new Event('resize'));   // hugi.js가 새 크기(--hg-w)를 다시 읽는다
        if (!RM && hgRoot.animate) hgRoot.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2, 0, 0, 1)' });
      });
      askIo.observe($('#ask'));
      hgSeen($('#about'), 'secResume'); hgSeen($('#contact'), 'wave');   // 소개 구역은 곰곰이 생각, 맨 아래 연락처는 손 흔들기(구석에서 가리킬 버튼이 없어서)
    }
  }

  /* ── 클릭 위임 ─────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    var sn = e.target.closest('.ans.speaking .sn');
    if (sn && !e.target.closest('[data-cite]') && VOICE.btn && VOICE.btn.closest('.ans') === sn.closest('.ans')) { seekTo(sn.closest('.ans'), +sn.dataset.sn); return; }
    var lb = e.target.closest('[data-listen]');
    if (lb) { var A = lb.closest('.ans'); if (VOICE.btn === lb) stopVoice(); else speak(A, lb); return; }
    if (e.target.closest('#auto-read') || e.target.closest('#g-voice')) { setAuto(!VOICE.auto); return; }
    if (e.target.closest('#g-menu')) { sideOpen(true); return; }
    if (e.target.closest('#side-x') || e.target.closest('#side-scrim')) { sideOpen(false); return; }
    if (e.target.closest('#side') && e.target.closest('[data-open],[data-scroll],[data-top]')) sideOpen(false);   // 메뉴에서 고르면 닫고 이동
    if (e.target.closest('#vchip')) { if (VM.hidden) openVoices(); else closeVoices(); return; }
    var vo = e.target.closest('.vopt'); if (vo) { chooseVoice(vo.dataset.voice, vo); return; }
    var fb = e.target.closest('[data-file]'); if (fb) { saveFile(FILEQ[+fb.dataset.file], fb); return; }
    var ib = e.target.closest('[data-img]'); if (ib) { var im = IMG[ib.dataset.img]; if (im) { var at = im.at.split('/'); openDetail(at[0], at[1]); } return; }
    if (e.target.closest('[data-att-x]')) { PENDING = null; showAtt(); hasText(); return; }
    if (e.target.closest('[data-mail-draft]')) { ask('지금까지 나눈 대화를 바탕으로 제가 한정민에게 보낼 메일 초안을 써 주세요', '한정민에게 보낼 메일 초안 써 주세요', { mode: 'mail' }); return; }
    var mb = e.target.closest('[data-mail-open],[data-mail-copy]');
    if (mb) {
      var box = mb.closest('.mailbox'), subj = box.querySelector('[data-mail-subj]').value, txt = box.querySelector('[data-mail-body]').value;
      var to = ($('#email') && $('#email').dataset.copy) || '';
      if (mb.hasAttribute('data-mail-open')) { location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(txt); return; }
      var ok = function () { hgEvent('copyOk'); mb.textContent = '복사했어요'; setTimeout(function () { mb.textContent = '복사하기'; }, 1600); };
      try { navigator.clipboard.writeText('받는 사람: ' + to + '\n제목: ' + subj + '\n\n' + txt).then(ok, function () { box.querySelector('[data-mail-body]').select(); }); } catch (err) { box.querySelector('[data-mail-body]').select(); }
      return;
    }
    var t = e.target.closest('[data-open],[data-close],[data-cite],[data-act],[data-team],[data-q],[data-f],[data-scroll],[data-top],#fit-reset,#email');
    if (!t || t.closest('#sug')) return;
    if (t.dataset.open) { e.preventDefault(); openDetail(t.dataset.open, t.dataset.sec); }
    else if (t.hasAttribute('data-close')) closeDetail();
    else if (t.dataset.cite) goCard(t.dataset.cite);
    else if (t.dataset.act) ACTIONS[t.dataset.act](t.dataset.t);
    else if (t.dataset.team) chooseTeam(t.dataset.team);
    else if (t.dataset.q) ask(t.dataset.q);
    else if (t.dataset.f) setFilter(t.dataset.f);
    else if (t.dataset.scroll) { e.preventDefault(); scrollTo(t.dataset.scroll); }
    else if (t.hasAttribute('data-top')) { e.preventDefault(); closeDetail(); window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); }
    else if (t.id === 'fit-reset') { ORDER = P.map(function (p) { return p.id; }); renderWorks(); $('#fit').hidden = true; }
    else if (t.id === 'email') {
      var sub = $('#email-sub');
      var done = function (ok) { if (ok) hgEvent('copyOk'); sub.textContent = ok ? '복사했어요' : '주소를 길게 눌러 복사해 주세요'; setTimeout(function () { sub.textContent = '누르면 복사돼요'; }, 1600); };
      try { navigator.clipboard.writeText(t.dataset.copy).then(function () { done(true); }, function () { done(false); }); } catch (err) { done(false); }
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#side').hidden) { sideOpen(false); return; } if (e.key === 'Escape' && !D.hidden) closeDetail(); });
  // 사이드 탭(GNB ③): 프로젝트마다 구성(섹션)을 펼쳐 바로 그 칸으로 간다
  $('#side-pj').innerHTML = P.map(function (p) {
    return '<details><summary><span class="nm">' + esc(p.name) + '</span><span class="tg">' + esc((p.tags || []).slice(0, 2).join(' · ')) + '</span><span class="ms" aria-hidden="true">expand_more</span></summary>' +
      '<div class="secs"><button type="button" class="all" data-open="' + p.id + '">전체 보기</button>' +
      K.sections.map(function (s) { return '<button type="button" data-open="' + p.id + '" data-sec="' + s.id + '">' + esc(s.name) + '</button>'; }).join('') + '</div></details>';
  }).join('');
  var sideBack = null;
  function sideOpen(on) {
    var sd = $('#side'), sc = $('#side-scrim'), mb = $('#g-menu');
    if (on === !sd.hidden) return;
    sd.hidden = sc.hidden = !on; mb.setAttribute('aria-expanded', String(on));
    if (on) { sideBack = document.activeElement; if (!RM) { sd.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2, 0, 0, 1)' }); sc.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); } $('#side-x').focus(); }
    else if (sideBack && sideBack.focus) sideBack.focus({ preventScroll: true });
  }
  window.addEventListener('scroll', function () { $('#hdr').classList.toggle('on', window.scrollY > 8); }, { passive: true });

  if (!VOICE.ok) { $('#auto-read').hidden = true; $('#g-voice').hidden = true; } else setAuto(VOICE.auto);
  renderVoices();
  function fromHash() { var h = location.hash.slice(1); if (BY[h]) openDetail(h); else if (!h) closeDetail(); }
  window.addEventListener('hashchange', fromHash); fromHash();
})();
</script>
